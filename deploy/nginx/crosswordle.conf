# nginx site for the private lab host. Replace the example name and certificate paths.
#
# /srv/crosswordle/current is a symlink to the live release, switched by scripts/deploy-lab.mjs.
# /etc/nginx/snippets/crosswordle-headers.conf is rendered by:
#   node scripts/render-headers.mjs --format nginx --out crosswordle-headers.conf

server {
    listen 80;
    listen [::]:80;
    server_name crosswordle.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crosswordle.example.com;

    ssl_certificate     /etc/ssl/crosswordle/crosswordle.crt;
    ssl_certificate_key /etc/ssl/crosswordle/crosswordle.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /srv/crosswordle/current;
    index index.html;

    include /etc/nginx/snippets/crosswordle-headers.conf;
}
