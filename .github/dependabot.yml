version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Types must match the Node.js major in "engines", not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint and svelte-check don't support TypeScript 7 yet. Lift this when they do.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
